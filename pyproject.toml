[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpmap"
version = "0.1.0"
description = "An empirical risk study of the public MCP server ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "security", "supply-chain", "measurement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpmap = "mcpmap.cli:main"

[project.urls]
Repository = "https://github.com/mt211211/alpha"
Methodology = "https://github.com/mt211211/alpha/blob/main/docs/METHODOLOGY.md"
Ethics = "https://github.com/mt211211/alpha/blob/main/docs/ETHICS.md"

[tool.setuptools.packages.find]
include = ["mcpmap*"]

[tool.setuptools.package-data]
mcpmap = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
