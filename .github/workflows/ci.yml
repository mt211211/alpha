name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # The capability inference is the load-bearing heuristic: if its accuracy
      # regresses, every published capability figure moves with it. Gate on it.
      - name: Capability inference accuracy gate
        run: mcpmap validate --min-f1 0.85

      - name: Fixture corpus is reproducible from its generator
        run: python fixtures/build_fixtures.py --check

      - name: Report pipeline smoke test
        run: |
          mcpmap report fixtures/snapshots/2026-09-01-synthetic.json \
            --drift-from fixtures/snapshots/2026-06-01-synthetic.json \
            --now 2026-09-01T00:00:00+00:00 -o /tmp/report.md
          grep -q "Panel (present in both)" /tmp/report.md

      # The analysis path must never need the network. Prove it by running it
      # inside an empty network namespace. `unshare -rn` isolates only this
      # command -- it does not touch the runner's own networking, which a
      # blanket iptables DROP would (taking the job's control plane with it).
      - name: Analysis path runs with no network access
        run: |
          # Positive control: the isolation must actually isolate, or the rest
          # of this step silently passes and proves nothing.
          if unshare -rn curl -sS --max-time 5 https://1.1.1.1 > /dev/null 2>&1; then
            echo "::error::network reachable inside the namespace; this check proves nothing"
            exit 1
          fi
          echo "network namespace confirmed empty"

          unshare -rn mcpmap analyse fixtures/snapshots/2026-09-01-synthetic.json > /dev/null
          unshare -rn mcpmap validate --min-f1 0.85 > /dev/null
          unshare -rn python -m pytest -q tests/test_no_execution.py
          echo "analysis path is offline-clean"
