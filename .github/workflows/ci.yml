name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # The capability inference is the load-bearing heuristic: if its accuracy
      # regresses, every published capability figure moves with it. Gate on it.
      - name: Capability inference accuracy gate
        run: mcpmap validate --min-f1 0.85

      - name: Fixture corpus is reproducible
        run: |
          python fixtures/build_fixtures.py --check

      - name: Report pipeline smoke test
        run: |
          mcpmap report fixtures/snapshots/2026-09-01-synthetic.json \
            --drift-from fixtures/snapshots/2026-06-01-synthetic.json \
            --now 2026-09-01T00:00:00+00:00 -o /tmp/report.md
          grep -q "Panel (present in both)" /tmp/report.md

  offline:
    # The analysis path must never need the network. Prove it by removing it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Analysis runs with no network access
        run: |
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          mcpmap analyse fixtures/snapshots/2026-09-01-synthetic.json > /dev/null
          mcpmap validate --min-f1 0.85 > /dev/null
